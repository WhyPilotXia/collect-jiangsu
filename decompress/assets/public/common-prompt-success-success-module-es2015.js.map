export default "<ion-header [translucent]=\"true\">\n    <ion-toolbar>\n        <ion-title>\n            <div class=\"header-icon\">\n                <Icon type=\"left\"  size=\"lg\" (click)=\"routeBack()\"></Icon>\n            </div>\n            <div class=\"header-font\" (click)=\"routeBack()\">\n                <span>返回</span>\n            </div>\n        </ion-title>\n    </ion-toolbar>\n</ion-header>\n\n\n<ion-content class=\"tabContentCss\">\n\n    <div style=\"background-color: white; padding-top: 10px\">\n        <Result [img]=\"img2\" [title]=\"title\" [message]=\"message\">\n            <ng-template #img2>\n                <!--<Icon id=\"spe\" [type]=\"'check-circle'\" [color]=\"'#1095FF'\"></Icon>-->\n                <ion-icon name=\"checkmark-circle-outline\" class=\"spe\"></ion-icon>\n            </ng-template>\n        </Result>\n\n        <div class=\"button\" (click)=\"click()\">\n            <span>{{btnCon}}</span>\n        </div>\n    </div>\n</ion-content>\n";
