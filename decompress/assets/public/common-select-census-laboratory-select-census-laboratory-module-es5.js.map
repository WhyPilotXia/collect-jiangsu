export default "<ion-header [translucent]=\"true\">\n  <ion-toolbar>\n    <ion-title>\n      <div class=\"header-icon\">\n        <Icon type=\"left\" size=\"lg\" (click)=\"routeBack()\"></Icon>\n      </div>\n      <div class=\"header-font\" (click)=\"routeBack()\">\n        <span>返回</span>\n      </div>\n      <span class=\"header-title\">选择医院/机构</span>\n    </ion-title>\n  </ion-toolbar>\n</ion-header>\n\n<ion-content>\n  <div class=\"select-census-address-bar\">\n    <div class=\"select\">\n      <div>\n        <input\n          type=\"text\"\n          placeholder=\"请输入医院/机构\"\n          [(ngModel)]=\"laboratoryInput\"\n          (keyup)=\"searchRealTime($event)\"\n        />\n      </div>\n      <span (click)=\"search()\"> 搜索 </span>\n    </div>\n\n<!--    <PullToRefresh-->\n<!--            [ngStyle]=\"dtPullToRefreshStyle\"-->\n<!--            [direction]=\"refreshState.direction\"-->\n<!--            [(ngModel)]=\"refreshState.refreshState\"-->\n<!--            [endReachedRefresh]=\"refreshState.endReachedRefresh\"-->\n<!--            (onRefresh)=\"doRefresh($event)\"-->\n<!--    >-->\n      <List class=\"select-list\">\n        <RadioItemGroup [(ngModel)]=\"laboratory.id\">\n          <ng-container *ngFor=\"let item of laboratoryList; let i = index\">\n            <RadioItem\n                    [name]=\"item.laboratoryName\"\n                    [value]=\"item.id\"\n                    class=\"selectLaboratory{{i}} load-model-radio\"\n                    (click)=\"selectCheackRegister(i, item)\"\n                    [wrap]=\"true\"\n            >\n              <span>{{item.laboratoryName}}</span>\n            </RadioItem>\n          </ng-container>\n        </RadioItemGroup>\n      </List>\n<!--    </PullToRefresh>-->\n\n    <ng-template #loading>\n      <Icon type=\"loading\"></Icon>\n    </ng-template>\n\n<!--    <List class=\"select-list\">-->\n<!--      <RadioItemGroup [(ngModel)]=\"laboratory.id\">-->\n<!--        <ng-container *ngFor=\"let item of laboratoryList; let i = index\">-->\n<!--          <RadioItem-->\n<!--            [name]=\"item.laboratoryName\"-->\n<!--            [value]=\"item.id\"-->\n<!--            class=\"selectLaboratory{{i}} load-model-radio\"-->\n<!--            (click)=\"selectCheackRegister(i, item)\"-->\n<!--            [wrap]=\"true\"-->\n<!--          >-->\n<!--            <span>{{item.laboratoryName}}</span>-->\n<!--          </RadioItem>-->\n<!--        </ng-container>-->\n<!--      </RadioItemGroup>-->\n<!--    </List>-->\n    <div class=\"okButton\" (click)=\"okButton()\">\n      <div>确定</div>\n    </div>\n  </div>\n</ion-content>\n\n<div class=\"census-laboratory-load-bar\">\n  <ion-spinner icon=\"android\" class=\"load-css\"></ion-spinner>\n</div>\n";
