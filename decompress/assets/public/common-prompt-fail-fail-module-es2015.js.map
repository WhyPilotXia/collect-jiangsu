export default "<ion-header [translucent]=\"true\">\n    <ion-toolbar>\n        <ion-title>\n            <div class=\"header-icon\">\n                <Icon type=\"left\" color=\"#ffffff\" size=\"lg\" (click)=\"routeBack()\"></Icon>\n            </div>\n            <div class=\"header-font\" (click)=\"routeBack()\">\n                <span>返回</span>\n            </div>\n        </ion-title>\n    </ion-toolbar>\n</ion-header>\n\n\n<ion-content class=\"tabContentCss\">\n\n    <div style=\"background-color: white; padding-top: 10px\">\n        <Result [img]=\"img2\" [title]=\"'网络连接超时'\" [message]=\"'请检查是否有网络信号'\">\n            <ng-template #img2>\n                <ion-icon name=\"close-circle-outline\" class=\"spe\"></ion-icon>\n            </ng-template>\n        </Result>\n\n        <div class=\"button\" (click)=\"routeBack()\">\n            <span>返回首页</span>\n        </div>\n    </div>\n</ion-content>\n";
