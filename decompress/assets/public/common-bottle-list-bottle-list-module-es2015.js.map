export default "<ion-header [translucent]=\"true\">\n    <ion-toolbar>\n        <ion-title>\n            <div class=\"header-icon\">\n                <Icon type=\"left\"  size=\"lg\" (click)=\"routeBack()\"></Icon>\n            </div>\n            <div class=\"header-font\" (click)=\"routeBack()\">\n                <span>返回</span>\n            </div>\n            <span class=\"header-title\">试管列表</span>\n        </ion-title>\n    </ion-toolbar>\n</ion-header>\n\n\n<ion-content class=\"tabContentCss\">\n\n    <div class=\"tab-top\">\n        <div  class=\"bar-sample-number\">\n            <span>{{titleInfo}}箱内试管数量</span>\n            <span class=\"number\">{{bottleList.length}}</span>\n        </div>\n        <ng-container *ngIf=\"isCloseBox == '0'\">\n            <div class=\"bar-button\" (click) = \"confirmBox()\">\n                封箱\n            </div>\n        </ng-container>\n    </div>\n\n    <div class=\"am-demo-page\">\n        <ng-container *ngIf=\"bottleList.length >0;else showEmpty\">\n            <List [className]=\"'my-list'\">\n                <ng-container *ngFor=\"let info of bottleList;let i = index\">\n                    <SwipeAction style=\"background-color: gray\" [right]=\"isCloseBox === '0'? right: false\" (onOpen)=\"openDelete(info.tubeBarId,info.tubeBarcode)\">\n                        <ListItem [extra]=\"info.patientCount.toString()\" [arrow]=\"'horizontal'\" (onClick)=\"onClick(info,i)\">\n                            <span style=\"color: #535353\">{{i+1}}.</span>{{info.tubeBarcode}}\n                            <!--<ng-container *ngIf=\"!info.closedTube\">-->\n                                <!--<span class=\"closeBoxBtn\" (click)=\"confirmTube(info.tubeBarcode,info.tubeBarId, $event)\">封管</span>-->\n                            <!--</ng-container>-->\n                        </ListItem>\n                    </SwipeAction>\n                </ng-container>\n            </List>\n        </ng-container>\n        <ng-template #showEmpty>\n            <img src=\"../../../assets/icon/empty.svg\" width=\"150\" height=\"150\" style=\"margin-top: 100px;align-items: center;width: 100%;\">\n        </ng-template>\n    </div>\n\n</ion-content>\n\n<ng-container *ngIf=\"isCloseBox == '0'\">\n    <ion-footer>\n        <div class=\"bar-footer\">\n            <div class=\"bar-footer-scan\" (click) = \"clickScan()\">扫描新试管码</div>\n        </div>\n    </ion-footer>\n</ng-container>";
