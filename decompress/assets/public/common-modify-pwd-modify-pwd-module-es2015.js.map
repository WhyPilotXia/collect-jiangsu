export default "<ion-header [translucent]=\"true\">\n  <ion-toolbar color=\"primary\">\n    <ion-title>\n      <div class=\"header-wrap\">\n        <span class=\"header-icon\" *ngIf=\"!pwdForced && (!strongPwdPolicy || (strongPwdPolicy && isStrongPwd))\" (click)=\"routeBack()\">\n          <ion-icon class=\"header-i\" name=\"arrow-back-outline\"></ion-icon>\n        </span>\n        <span class=\"header-title\">修改密码</span>\n      </div>\n    </ion-title>\n    <ion-buttons slot=\"end\" (click)=\"logout()\">\n      <ion-button>\n        <ion-icon class=\"header-i\" name=\"log-out-outline\"></ion-icon>\n      </ion-button>\n    </ion-buttons>\n  </ion-toolbar>\n</ion-header>\n\n<ion-content>\n\n  <div class=\"main h100 bgw\">\n    <div class=\"chief\">\n      <div class=\"kv\">\n        <span class=\"k\"><span class=\"req\">*</span> 新密码</span>\n        <span class=\"v\"><input type=\"password\" [(ngModel)]=\"pwdObj.newPwd\"/></span>\n      </div>\n      <div class=\"kv\">\n        <span class=\"k\"><span class=\"req\">*</span> 确认密码</span>\n        <span class=\"v\"><input type=\"password\" [(ngModel)]=\"pwdObj.againPwd\" /></span>\n      </div>\n      <div class=\"result\">{{validResult}}</div>\n      <div class=\"rule-list\" *ngIf=\"strongPwdPolicy\">\n        <h3>强密码规则</h3>\n        <ul>\n          <li *ngFor=\"let item of ruleList;\"> {{item}} </li>\n        </ul>\n      </div>\n    </div>\n    <div class=\"ft\"> \n      <button class=\"btn-submit\" (click)=\"getKey()\" [disabled]=\"isSuccess\">提交</button>\n    </div>\n  </div>\n  \n</ion-content>";
