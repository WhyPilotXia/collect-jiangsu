export default "<ion-header [translucent]=\"true\">\n  <ion-toolbar>\n    <ion-title>\n      <div class=\"header-icon\">\n        <Icon type=\"left\" size=\"lg\" (click)=\"routeBack()\"></Icon>\n      </div>\n      <div class=\"header-font\" (click)=\"routeBack()\">\n        <span>返回</span>\n      </div>\n      <span class=\"header-title\">选择采集点</span>\n    </ion-title>\n  </ion-toolbar>\n</ion-header>\n\n<ion-content>\n  <div class=\"select-census-address-bar\">\n    <div class=\"select\">\n      <div>\n        <input\n          type=\"text\"\n          placeholder=\"请输入地点\"\n          [(ngModel)]=\"addressInput\"\n          (keyup)=\"searchRealTime($event)\"\n        />\n      </div>\n      <span (click)=\"search()\"> 搜索 </span>\n    </div>\n    <List class=\"select-list\">\n      <RadioItemGroup [(ngModel)]=\"censusAddress.id\">\n        <ng-container *ngFor=\"let item of addressList; let i = index\">\n          <RadioItem\n            [name]=\"item.address\"\n            [value]=\"item.id\"\n            class=\"selectAddress{{i}} load-model-radio\"\n            (click)=\"selectCheackRegister(i, item)\"\n            [wrap]=\"true\"\n          >\n            <span>{{(item.area == null || item.area == ''?'': item.area+'-') +\n            (item.street == null || item.street == ''?'': item.street+'-') +item.address}}</span>\n          </RadioItem>\n        </ng-container>\n      </RadioItemGroup>\n    </List>\n    <div class=\"okButton\" (click)=\"okButton()\">\n      <div>确定</div>\n    </div>\n  </div>\n</ion-content>\n\n<div class=\"census-address-load-bar\">\n  <ion-spinner icon=\"android\" class=\"load-css\"></ion-spinner>\n</div>\n";
